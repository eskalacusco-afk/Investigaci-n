 for(const task of p.customTasks||[]){if(task.due&&!['completado','no aplica'].includes(task.status))add('c_'+task.id,task.title,task.due,task.note||'Meta pactada');}
 for(const date of p.deadlines||[]){if(date.date&&!date.done)add('d_'+date.id,date.title,date.date,date.note||'Reunión o compromiso registrado');}
 for(const svc of servicesOf(p)){if(svc.dueDate&&!['completado','cancelado'].includes(svc.status))add('svc_'+svc.id,svc.name+' · fecha final acordada',svc.dueDate,'Entrega pactada');for(const task of svc.deliverables||[]){if(task.due&&!['completado','no aplica'].includes(task.status))add('svc_'+svc.id+'_'+task.id,svc.name+' · '+task.title,task.due,'Meta de servicio pactada');}}
 return out;
}

 };

 let page={dashboard:renderDashboard,theses:renderTheses,services:renderServices,detail:renderDetail,agenda:renderAgenda,finances:renderFinances,process:renderProcess,backup:renderBackup}[view]||renderDashboard;document.getElementById('main').innerHTML=page()}
function alertHtml(a,showProject=true){return `<div class="alert-row"><span class="dot ${urgency(a)}"></span><div class="alert-main"><div class="alert-title">${E(a.title)}</div><div class="alert-detail">${showProject?`<button class="linkbutton" data-action="open-project" data-id="${E(a.projectId)}">${E(a.projectTitle)}</button> · `:''}${E(a.detail)} · ${fmt(a.date)}</div></div><div class="alert-side"><span class="chip ${urgency(a)}">${E(labelUrgency(a))}</span></div></div>`}
function renderDashboard(){const a=allAlerts().filter(x=>x.left<=14).slice(0,8);const ac=activeProjects();const agreements=projects.reduce((t,p)=>t+agreed(p),0);const payments=projects.reduce((t,p)=>t+received(p),0);
 return `<section class="es-hero"><div class="es-hero-copy"><div class="es-hero-kicker">ESKALA · TU CENTRO DE GESTIÓN</div><h1>Que cada avance cuente.</h1><p>Controla tus tesis, servicios contratados, entregables, metas pactadas y pagos desde un solo lugar.</p><button class="btn hero-action" data-action="new-project">＋ Registrar nuevo trabajo</button></div><div class="es-hero-logo"><img src="${document.getElementById('brandSymbolAsset').src}" alt="Símbolo de ESKALA"/><small>CONOCIMIENTO<br>QUE IMPULSA</small></div></section><div class="es-section-caption">Tu actividad en un vistazo</div>
 <div class="kpis"><div class="kpi"><div class="kpi-top">Expedientes activos <span class="kpi-icon">▤</span></div><div class="kpi-value">${ac.length}</div><div class="kpi-foot">${projects.length} expediente(s) registrado(s)</div></div>
 <div class="kpi"><div class="kpi-top">Metas / reuniones próximas <span class="kpi-icon red">◷</span></div><div class="kpi-value">${warningTotal()}</div><div class="kpi-foot">Plazos con 7 días o menos</div></div>
 <div class="kpi"><div class="kpi-top">Cobrado <span class="kpi-icon teal">S/</span></div><div class="kpi-value money" style="font-size:25px">${money(payments)}</div><div class="kpi-foot">De ${money(agreements)} acordados</div></div>

}
function renderTheses(){const filtered=projects.filter(p=>(projectFilter==='todos'||(projectFilter==='activas'?p.status!=='archivada':p.status==='archivada'))&&normalize(p.title+' '+(p.students||[]).map(s=>s.name).join(' ')+' '+servicesOf(p).map(x=>x.name).join(' ')+' '+p.advisor+' '+p.university).includes(normalize(query)));

 ${filtered.length?`<div class="project-grid">${filtered.map(p=>`<article class="panel project-card" tabindex="0" role="button" data-action="open-project" data-id="${E(p.id)}"><div class="top"><span class="chip ${p.status==='archivada'?'':'teal'}">${p.status==='archivada'?'Archivada':'Activa'}</span><span class="text-xs muted">Actualizada ${fmt(p.updatedAt)}</span></div><h3>${E(p.title)}</h3><div class="meta">${E((p.students||[]).map(s=>s.name).join(' · ')||'Tesista(s) por registrar')}<br>${E(p.university||'Institución no indicada')}<br>${E(projectHasService(p)?servicesOf(p).map(x=>x.name).join(' · '):lastStage(p))}</div><div class="bottom"><span>Avance de la ruta</span><span><strong>${progress(p)}%</strong></span></div><div class="progress" style="margin-top:8px"><div class="progress-fill" style="width:${progress(p)}%"></div></div><div class="bottom"><span class="card-money">Cobrado ${money(received(p))}</span><span>${alertsFor(p).filter(a=>a.left<=7).length} alerta(s)</span></div></article>`).join('')}</div>`:empty('No se encontraron tesis','Crea tu primer expediente o modifica los filtros para encontrarlo.','<button class="btn btn-primary" data-action="new-project">＋ Nueva tesis</button>')}`;

function openProject(id,which='services'){if(!projects.some(p=>p.id===id))return;selectedId=id;view='detail';tab=which;hideMenu();render();window.scrollTo({top:0,behavior:'instant'})}
function taskLine(p,t){const info=t.custom?t:(p.tasks?.[t.id]||{}),st=info.status||'pendiente',completed=st==='completado',na=st==='no aplica';return `<div class="task-row"><button class="task-mark ${completed?'done':na?'na':['en revisión','con observaciones'].includes(st)?'review':''}" data-action="toggle-task" data-id="${E(t.id)}" data-custom="${t.custom?'1':'0'}" title="${completed?'Reabrir tarea':'Marcar como completada'}" aria-label="${completed?'Reabrir':'Completar'} ${E(t.title)}">${completed?'✓':na?'–':['en revisión','con observaciones'].includes(st)?'!':'○'}</button><div class="task-content"><div class="name" style="${completed?'text-decoration:line-through;color:#778b88':''}">${E(t.title)}</div><div class="detail">${E(t.detail||'')}${info.due?' · Fecha límite: '+fmt(info.due):''}${info.link&&safeUrl(info.link)?` · <a href="${E(info.link)}" target="_blank" rel="noopener noreferrer">Ver documento ↗</a>`:''}${info.note?' · '+E(info.note):''}</div></div><div class="task-tools"><span class="chip ${completed?'green':st==='con observaciones'?'red':st==='en revisión'?'amber':st==='en curso'?'blue':''}">${LABELS[st]||'Pendiente'}</span><button class="btn btn-xs" data-action="edit-task" data-id="${E(t.id)}" data-custom="${t.custom?'1':'0'}">Editar</button></div></div>`}
function renderRoute(p){if(p.routeEnabled===false)return `<div class="notice"><strong>Expediente de servicio puntual.</strong> No se exige una ruta de trámites universitarios para este encargo. Los entregables, los pagos y las metas están en «Servicios y entregables». Si necesitas seguir el trámite institucional de esta tesis, edita la ficha y activa la ruta.</div>`;let content=sectionsFor(p).map(sec=>{const tasks=[...tasksFor(p).filter(t=>t.section===sec.id),...(p.customTasks||[]).filter(t=>t.section===sec.id).map(t=>({...t,custom:true}))];const completed=tasks.filter(t=>isDoneTask(p,t)).length;return `<section class="flow-section"><div class="flow-head"><div class="flow-title-group"><div class="flow-num ${sec.color}">${sec.step}</div><div><h3>${E(sec.name)} ${sec.id==='s5'?'<span class="chip purple">EN PARALELO</span>':''}</h3><div class="flow-description">${E(sec.detail)}</div></div></div><div class="section-summary">${completed} / ${tasks.length}</div></div>${tasks.map(t=>taskLine(p,t)).join('')}<div style="padding:10px 18px;border-top:1px solid #f0f3f5"><button class="subtle-btn" data-action="add-custom-task" data-section="${sec.id}">＋ Añadir tarea personalizada en esta etapa</button></div></section>`}).join('');return `<div class="notice">${isUacPregrado(p)?'Ruta UAC pregrado: se conservan los nombres oficiales de los pasos 1 al 5; el Apto para Título Profesional puede tramitarse anticipadamente.':'Plantilla general EDITABLE de gestión: no es un procedimiento oficial de '+E(p.university||'esta universidad')+'. Añade tareas específicas cuando tengas el reglamento correspondiente.'} Registra estado, metas, responsable y enlaces privados de Drive.</div>${content}`}

function renderDetail(){const p=current();if(!p){view='theses';return renderTheses()};const pc=progress(p),al=alertsFor(p).filter(a=>a.left<=7).length;const tabs=[['services','Servicios y entregables'],['route','Ruta y tareas'],['students','Tesistas y pagos anteriores'],['dates','Fechas y metas'],['profile','Ficha del expediente'],['history','Bitácora']];

function getInstallments(s){let remainder=paid(s);return (s.installments||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).map(c=>{const allocated=Math.min(Math.max(0,+c.amount||0),Math.max(0,remainder));remainder=Math.max(0,remainder-allocated);return {...c,allocated,balance:Math.max(0,(+c.amount||0)-allocated)}})}

 ${all.length?all.map(s=>`<section class="panel student-panel"><div class="student-top"><div><h3>${E(s.name)}</h3><div class="panel-sub">${E(s.email||'Sin correo')} ${s.phone?' · '+E(s.phone):''}</div><div class="flex-gap" style="margin-top:9px"><span class="chip ${s.sustPago==='pagado'?'green':'amber'}">Tasa sust.: ${s.sustPago==='pagado'?'Pagada':'Pendiente'}</span><span class="chip ${s.tituloStatus==='obtenido'?'green':'blue'}">Título: ${E(s.tituloStatus||'pendiente')}</span><span class="chip ${s.apto==='obtenido'?'green':s.apto==='solicitado'?'blue':'amber'}">Apto / requisito: ${E(s.apto==='obtenido'?'Obtenido':s.apto==='solicitado'?'Solicitado':'Pendiente')}</span>${s.aptoDate?`<small class="muted">${fmt(s.aptoDate)}</small>`:''}</div></div><div class="flex-gap"><button class="btn btn-sm" data-action="edit-student" data-student="${E(s.id)}">✎ Editar</button><button class="btn btn-sm" data-action="add-payment" data-student="${E(s.id)}">＋ Pago</button></div></div>
 <div class="student-bottom"><div class="student-metrics"><div class="metric-soft"><span>Honorarios acordados</span><strong class="money">${money(s.agreed)}</strong></div><div class="metric-soft"><span>Pagado</span><strong class="money" style="color:var(--green)">${money(paid(s))}</strong></div><div class="metric-soft"><span>Saldo</span><strong class="money" style="color:var(--amber)">${money(Math.max(0,(+s.agreed||0)-paid(s)))}</strong></div></div>${(s.installments||[]).length&&Math.abs((s.installments||[]).reduce((total,cuota)=>total+(+cuota.amount||0),0)-(+s.agreed||0))>.009?`<div class="notice warn">Las cuotas programadas suman ${money((s.installments||[]).reduce((total,cuota)=>total+(+cuota.amount||0),0))} y el monto acordado es ${money(s.agreed)}. Verifica si faltan cuotas o existe una diferencia intencional.</div>`:''}
 <div class="row-flex section-bar"><h3>Cronograma de cuotas</h3><button class="btn btn-xs" data-action="add-installment" data-student="${E(s.id)}">＋ Programar cuota</button></div>
 ${(s.installments||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Concepto</th><th>Programado</th><th>Saldo de cuota</th><th>Estado</th><th></th></tr></thead><tbody>${getInstallments(s).map(c=>`<tr><td>${fmt(c.date)}</td><td>${E(c.note||'Cuota')}</td><td class="money-cell">${money(c.amount)}</td><td class="money-cell">${money(c.balance)}</td><td><span class="chip ${c.balance<.005?'green':daysLeft(c.date)<0?'red':daysLeft(c.date)<=7?'amber':''}">${c.balance<.005?'Cubierta':daysLeft(c.date)<0?'Vencida':'Pendiente'}</span></td><td><button class="linkbutton" data-action="delete-installment" data-student="${E(s.id)}" data-id="${E(c.id)}">Quitar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="panel-sub">Sin cronograma acordado. Puedes añadir cuotas y sus fechas cuando exista uno.</div>'}
 <div class="row-flex section-bar"><h3>Pagos recibidos</h3><button class="btn btn-xs" data-action="add-payment" data-student="${E(s.id)}">＋ Registrar pago</button></div>
 ${(s.payments||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th></th></tr></thead><tbody>${s.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(pay=>`<tr><td>${fmt(pay.date)}</td><td>${E(pay.note||'Abono')}${pay.receipt&&safeUrl(pay.receipt)?` · <a target="_blank" rel="noopener noreferrer" href="${E(pay.receipt)}">Recibo ↗</a>`:''}</td><td class="money-cell">${money(pay.amount)}</td><td><button class="linkbutton" data-action="delete-payment" data-student="${E(s.id)}" data-id="${E(pay.id)}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="panel-sub">Todavía no hay pagos registrados.</div>'}
 </div></section>`).join(''):empty('Registra a los tesistas','Agrega sus datos, lo acordado con cada uno y el cronograma de pagos.','<button class="btn btn-primary" data-action="add-student">＋ Agregar tesista</button>')}
 <div class="hint">${projectHasService(p)?'<strong>Importante:</strong> los honorarios de contratos nuevos se gestionan en la pestaña Servicios y entregables. No los dupliques aquí. ':''}Los importes de esta sección son <strong>honorarios de tu asesoría</strong>. El pago universitario de S/ 1,850 por tesista para la sustentación se controla separadamente dentro de la ruta y no se suma a tus cobros.</div>`}
function renderDates(p){const a=alertsFor(p);const dates=p.dates||{};return `<div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Fechas críticas del expediente</h2>${isUacPregrado(p)?'<button class="btn btn-sm" data-action="edit-dates">✎ Actualizar fechas</button>':''}</div><div class="panel-body"><div class="panel-sub" style="margin-bottom:10px">Las fechas administrativas son informativas: no generan recordatorios automáticos.</div>${(isUacPregrado(p)?KEYDATES:[]).map(([id,label])=>`<div class="moneyrow"><span>${E(label)}</span><strong>${fmt(dates[id])}</strong></div>`).join('')||'<p class="panel-sub">Las fechas administrativas de esta universidad se registran mediante metas y tareas específicas.</p>'}<div class="hint warning" style="margin-top:17px">Los días hábiles se estiman excluyendo sábados y domingos, <strong>sin descontar feriados</strong>. Verifica la recepción/notificación y el reglamento vigente en cada expediente.</div></div></section>
 <section class="panel"><div class="panel-head"><h2>Metas y reuniones pactadas</h2><button class="btn btn-sm" data-action="add-deadline">＋ Fecha especial</button></div><div class="panel-body">${a.length?a.map(x=>alertHtml(x,false)).join(''):empty('Sin metas o reuniones pendientes','Registra una meta con fecha o una reunión pactada.')}</div></section></div>
 <section class="panel" style="margin-top:16px"><div class="panel-head"><h2>Fechas añadidas manualmente</h2><button class="btn btn-sm" data-action="add-deadline">＋ Agregar fecha</button></div><div class="panel-body">${(p.deadlines||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>Compromiso</th><th>Fecha</th><th>Notas</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${p.deadlines.map(d=>`<tr><td>${E(d.title)}</td><td>${fmt(d.date)}</td><td>${E(d.note||'—')}</td><td><span class="chip ${d.done?'green':'amber'}">${d.done?'Realizado':'Pendiente'}</span></td><td><button class="linkbutton" data-action="toggle-deadline" data-id="${E(d.id)}">${d.done?'Reabrir':'Completar'}</button> · <button class="linkbutton" data-action="delete-deadline" data-id="${E(d.id)}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="panel-sub">Aún no se han agregado compromisos adicionales, citas o fechas de entrega.</p>'}</div></section>`}
function renderProfile(p){return `<div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Información y documentos</h2><button class="btn btn-sm" data-action="edit-project">✎ Editar ficha</button></div><div class="panel-body">${[['Título',p.title],['Universidad',p.university],['Nivel',p.level],['Asesor universitario',p.advisor],['Creación de expediente',fmt(p.createdAt)],['Último seguimiento',fmt(p.lastFollowUp)],['Estado',p.status==='archivada'?'Archivada':'Activa'],['Situación administrativa UAC',({vigente:'Vigente',archivado:'Archivado',desarchivamiento:'Desarchivamiento en trámite',desarchivado:'Desarchivado'})[p.adminStatus]||'Vigente']].map(([k,v])=>`<div class="moneyrow"><span>${E(k)}</span><strong style="text-align:right;max-width:62%">${E(v||'No indicado')}</strong></div>`).join('')}<div class="section-bar"><h3>Notas del contrato / particularidades</h3></div><div class="panel-sub">${E(p.description||'Aún no se añadieron notas. Puedes registrar entregables contratados, condiciones especiales, responsabilidades y acuerdos.')}</div><div class="section-bar"><h3>Carpeta del expediente</h3></div>${p.folder&&safeUrl(p.folder)?`<a target="_blank" rel="noopener noreferrer" href="${E(p.folder)}">Abrir carpeta privada del expediente ↗</a>`:'<div class="panel-sub">Sin vínculo a carpeta documental.</div>'}</div></section>
 <div class="stack"><section class="panel"><div class="panel-head"><h2>Acciones de mantenimiento</h2></div><div class="panel-body stack" style="gap:9px"><button class="btn fullw" data-action="followup">✓ Registrar reunión o seguimiento</button><button class="btn fullw" data-action="archive-project">${p.status==='archivada'?'↺ Reactivar tesis':'▤ Archivar tesis'}</button><button class="btn btn-danger fullw" data-action="delete-project">Eliminar expediente permanentemente</button></div></section><div class="hint">Por seguridad, guarda los documentos de la tesis en una carpeta privada (por ejemplo, Google Drive) y aquí registra solamente sus enlaces. Esta página no sube archivos a servidores.</div></div></div>`}
function renderHistory(p){return `<section class="panel"><div class="panel-head"><h2>Bitácora y próximos pasos</h2><button class="btn btn-primary btn-sm" data-action="followup">＋ Registrar seguimiento</button></div><div class="panel-body"><p class="panel-sub">Utiliza este registro para conversaciones, compromisos, coordinaciones, citas y recordatorios. Mantiene una historia de los avances más relevantes.</p><div class="timeline">${(p.history||[]).length?(p.history||[]).map(h=>`<div class="timeline-item"><small>${fmt(h.date)}</small><p>${E(h.text)}</p></div>`).join(''):'<div class="panel-sub">Sin registros aún.</div>'}</div></div></section>`}
function renderAgenda(){const a=allAlerts();const display=a.filter(x=>agendaFilter==='todos'||agendaFilter==='urgentes'&&x.left<=7||agendaFilter==='30'&&x.left<=30&&x.left>=0||agendaFilter==='vencidos'&&x.left<0);
 return `${header('Metas y reuniones','Únicamente fechas que hayas pactado y registrado. No hay correos, notificaciones externas ni alertas por inactividad.')}<div class="filter-tabs">${[['urgentes','En 7 días o vencidos'],['30','Próximos 30 días'],['vencidos','Pendientes vencidos'],['todos','Todos']].map(([k,label])=>`<button class="filter-pill ${agendaFilter===k?'active':''}" data-action="agenda-filter" data-filter="${k}">${label}</button>`).join('')}</div><section class="panel"><div class="panel-head"><h2>${display.length} compromiso(s)</h2><span class="panel-sub">Al entrar, ordenados por fecha</span></div><div class="panel-body">${display.length?display.map(x=>alertHtml(x,true)).join(''):empty('Sin fechas para mostrar','Añade una meta o reunión en la ficha de cualquier tesis.')}</div></section>`;
}
function renderFinances(){const all=projects.flatMap(p=>(p.students||[]).map(s=>({p,s})));const legacy=all.filter(({s})=>(+s.agreed||0)>0||(s.payments||[]).length||(s.installments||[]).length);const agreedTotal=projects.reduce((t,p)=>t+agreed(p),0);const paidTotal=projects.reduce((t,p)=>t+received(p),0);const pending=all.flatMap(({p,s})=>getInstallments(s).filter(c=>c.balance>.005&&daysLeft(c.date)<=30).map(c=>({...c,p,s,client:s.name}))).concat(projects.flatMap(p=>servicesOf(p).flatMap(s=>getServiceInstallments(s).filter(c=>c.balance>.005&&daysLeft(c.date)<=30).map(c=>({...c,p,s,client:s.name}))))).sort((a,b)=>a.date.localeCompare(b.date));return `${header('Pagos y cuotas','Honorarios acordados, montos recibidos, saldos y próximas cuotas por tesista.','<button class="btn" data-action="export-csv">⇩ Exportar resumen CSV</button>')}
 <div class="kpis"><div class="kpi"><div class="kpi-top">Honorarios acordados</div><div class="kpi-value money" style="font-size:23px">${money(agreedTotal)}</div></div><div class="kpi"><div class="kpi-top">Pagos recibidos</div><div class="kpi-value money" style="font-size:23px;color:var(--green)">${money(paidTotal)}</div></div><div class="kpi"><div class="kpi-top">Saldo por cobrar</div><div class="kpi-value money" style="font-size:23px;color:var(--amber)">${money(Math.max(0,agreedTotal-paidTotal))}</div></div><div class="kpi"><div class="kpi-top">Cuotas vencidas</div><div class="kpi-value">${pending.filter(c=>daysLeft(c.date)<0).length}</div></div></div>
 <section class="panel" style="margin-bottom:18px"><div class="panel-head"><h2>Servicios contratados (contratos nuevos)</h2></div><div class="panel-body">${projects.flatMap(p=>servicesOf(p).map(s=>({p,s}))).map(({p,s})=>`<div class="moneyrow"><span><strong>${E(s.name)}</strong><br><small>${E(p.title)}</small></span><span>${money(svcPaid(s))} de ${money(s.agreed)} · <button class="linkbutton" data-action="open-service" data-id="${E(p.id)}">Abrir</button></span></div>`).join('')||'<div class="panel-sub">Aún no hay servicios nuevos.</div>'}</div></section><section class="panel" style="margin-bottom:18px"><div class="panel-head"><h2>Honorarios anteriores por tesista</h2></div><div class="panel-body">${legacy.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Tesis / tesista</th><th>Acordado</th><th>Pagado</th><th>Saldo</th><th>Cronograma</th><th>Acción</th></tr></thead><tbody>${legacy.map(({p,s})=>`<tr><td><strong>${E(s.name)}</strong><div class="text-xs muted">${E(p.title)}</div></td><td class="money-cell">${money(s.agreed)}</td><td class="money-cell">${money(paid(s))}</td><td class="money-cell">${money(Math.max(0,(+s.agreed||0)-paid(s)))}</td><td>${(s.installments||[]).length} cuota(s)</td><td><button class="linkbutton" data-action="open-finance" data-id="${E(p.id)}">Ver / abonar →</button></td></tr>`).join('')}</tbody></table></div>`:empty('Sin contratos anteriores','Los nuevos contratos se controlan desde Servicios contratados.')}</div></section>
 <section class="panel"><div class="panel-head"><h2>Cuotas próximas o vencidas</h2><span class="panel-sub">Hasta los próximos 30 días</span></div><div class="panel-body">${pending.length?pending.map(c=>alertHtml({projectId:c.p.id,projectTitle:c.p.title,title:`${c.client} · ${money(c.balance)} pendiente`,detail:c.note||'Cuota programada',date:c.date,left:daysLeft(c.date)},true)).join(''):empty('Sin cuotas próximas','Las cuotas pendientes aparecerán aquí cuando registres su cronograma.')}</div></section>`}
function renderProcess(){return `${header('Guía UAC (pregrado)','Plantilla de referencia para pregrado UAC; no corresponde automáticamente a otras universidades.')}
 <div class="notice"><strong>Distinción importante:</strong> los cinco pasos siguientes conservan las denominaciones de tus imágenes. Las actividades de campo, estadística, sustentación y titulación son fases de trabajo adicionales de este sistema. Los plazos y tasas se muestran como referencias facilitadas por ti y deben confirmarse con la universidad.</div>
 <div class="process-cards">${OFFICIAL.map(x=>`<article class="process-card ${x.color}"><span class="step-chip">PASO ${x.no}</span><h3>${E(x.name)}</h3><ul>${x.bullets.map(b=>`<li>${E(b)}</li>`).join('')}</ul></article>`).join('')}</div>
 <section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Secuencia práctica recomendada</h2></div><div class="panel-body"><div class="steps-timeline"><span>1. Idea + asesor</span><span>→ Paso 1</span><span>→ Proyecto + Paso 2</span><span>→ Paso 3</span><span>→ Instrumentos + estadística</span><span>→ Tesis completa + Paso 4</span><span>→ Sustentación</span><span>→ Correcciones</span><span>→ Título</span></div><div class="hint"><strong>Paso 5 «Apto para Título Profesional»:</strong> tramitarlo en paralelo para cada bachiller tan pronto como sea posible, en vez de esperar a acabar el paso 4. Esto podría ahorrar tiempo, sujeto a la aceptación de la universidad.</div></div></section>
 <div class="dashboard-grid" style="margin-top:18px"><section class="panel"><div class="panel-head"><h2>Plazos de referencia (sin alertas automáticas)</h2></div><div class="panel-body">${[['Dictamen de proyecto','10 días hábiles para los dos dictaminantes (guía).'],['Inactividad después de inscripción','3 meses sin nuevo trámite: riesgo de archivo (según experiencia).'],['Desde inscripción','1 año máximo para solicitar dictamen de tesis (guía).'],['Dictamen de tesis concluida','15 días hábiles para los tres dictaminantes (guía).'],['Observaciones de la tesis','15 días hábiles para subsanar (guía).'],['Nuevo informe tras la subsanación','7 días hábiles (guía).'],['Observaciones después de sustentación','7 días; verificar si se trata de días hábiles o calendario.']].map(([name,desc])=>`<div class="moneyrow"><strong>${E(name)}</strong><span style="text-align:right;max-width:56%;color:var(--muted)">${E(desc)}</span></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Gastos y procedimientos</h2></div><div class="panel-body"><div class="moneyrow"><span>Trámites por Mesa de Partes</span><strong>Sin costo referido</strong></div><div class="moneyrow"><span>Desarchivamiento de tesis</span><strong>${money(17)}</strong></div><div class="moneyrow"><span>Pago para solicitar sustentación</span><strong>${money(1850)} por tesista</strong></div><div class="panel-sub" style="margin-top:14px">Si hay dos tesistas, cada uno paga S/ 1,850; total referencial S/ 3,700. Son pagos universitarios independientes de tus honorarios de asesoría. Confirma vigencia y conceptos antes de realizar pagos.</div><div class="hint warning" style="margin-top:14px">Si la resolución de Dictamen de Proyecto de Tesis fue emitida antes del 15/03/2024, la ruta de tu imagen indica el procedimiento anterior; desde el 15/03/2024, indica asignación de tercer dictaminante. Este tablero se enfoca en la ruta nueva.</div></div></section></div>`}
function renderBackup(){return `${header('Google y respaldo','Drive conserva los expedientes privados; Sheets muestra los índices de pagos y compromisos.')}<div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Conexión con Google</h2></div><div class="panel-body"><p><strong>${CLOUD?'Google Apps Script conectado':'Vista local de prueba, sin sincronización con Google'}</strong></p><p class="panel-sub">Estado: <span id="syncIndicator">${E(saveStatus)}</span></p><div class="stack" style="gap:12px;margin-top:16px">${systemInfo?`<a class="btn" href="${E(systemInfo.rootUrl)}" target="_blank" rel="noopener noreferrer">Abrir carpeta principal de Drive ↗</a><a class="btn" href="${E(systemInfo.sheetUrl)}" target="_blank" rel="noopener noreferrer">Abrir Google Sheets ↗</a>`:''}<button class="btn" data-action="retry-sync">↻ Reintentar guardado pendiente</button></div></div></section><section class="panel"><div class="panel-head"><h2>Copias y exportaciones</h2></div><div class="panel-body"><p class="panel-sub">Descarga una copia privada del contenido. No subas estos archivos a repositorios públicos.</p><div class="stack" style="gap:10px;margin-top:16px"><button class="btn btn-primary" data-action="export-json">⇩ Descargar respaldo JSON</button><button class="btn" data-action="import-json">⇧ Restaurar respaldo JSON</button><button class="btn" data-action="export-csv">⇩ Exportar pagos CSV</button></div><input type="file" id="importFile" class="hide" accept=".json,application/json"/></div></section></div><div class="notice warn" style="margin-top:18px">Los cambios deben indicar «Guardado en Google ✓» antes de cerrar la pestaña. Los documentos se mantienen privados en tu Drive. No se envían correos ni se crean eventos de Calendar.</div>`}
function safeUrl(raw){try{let u=new URL(raw);return ['https:','http:'].includes(u.protocol)}catch{return false}}
function showModal(title,description,content){document.getElementById('modalRoot').innerHTML=`<div class="modal-shade" data-shade="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modal-head"><div><h2>${E(title)}</h2>${description?`<p>${E(description)}</p>`:''}</div><button class="modal-close" data-action="close-modal" aria-label="Cerrar ventana">×</button></div><div class="modal-content">${content}</div></div></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input:not([type="hidden"]),.modal textarea,.modal select')?.focus(),50)}
function closeModal(){document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}
const field=(label,name,value='',type='text',extra='')=>`<div class="field"><label for="fld_${E(name)}">${E(label)}</label><input id="fld_${E(name)}" name="${E(name)}" type="${type}" value="${E(value)}" ${extra}/></div>`;
const opt=(values,current)=>values.map(([v,n])=>`<option value="${E(v)}" ${current===v?'selected':''}>${E(n)}</option>`).join('');
const selectField=(label,name,values,current)=>`<div class="field"><label for="fld_${E(name)}">${E(label)}</label><select id="fld_${E(name)}" name="${E(name)}">${opt(values,current)}</select></div>`;
const textareaField=(label,name,value='',placeholder='')=>`<div class="field full"><label for="fld_${E(name)}">${E(label)}</label><textarea id="fld_${E(name)}" name="${E(name)}" placeholder="${E(placeholder)}">${E(value)}</textarea></div>`;
const formEnd=extra=>`<div class="form-actions">${extra||''}<button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar cambios</button></div>`;
function modalProject(edit=false){const p=edit?current():null;showModal(edit?'Editar expediente':'Registrar nuevo expediente','Puedes empezar por estadística, diapositivas o asesoría completa; no necesitas registrar toda la tesis.',`<form data-form="project" data-edit="${edit?'1':'0'}"><div class="form-grid">${field('Título o identificación del trabajo *','title',p?.title||'','text','required maxlength="240"')}${field('Universidad','university',p?.university||'Universidad Andina del Cusco','text','list="universityOptions"')}
 <datalist id="universityOptions"><option value="Universidad Andina del Cusco"></option><option value="Universidad Nacional de San Antonio Abad del Cusco (UNSAAC)"></option><option value="Universidad Continental"></option><option value="Universidad César Vallejo"></option></datalist>
 ${selectField('Nivel / programa','level',[['Pregrado','Pregrado'],['Maestría','Maestría'],['Doctorado','Doctorado'],['Segunda especialidad','Segunda especialidad'],['Otro','Otro']],p?.level||'Pregrado')}${field('Asesor universitario','advisor',p?.advisor||'')}${selectField('Mostrar ruta de trámites universitarios','routeEnabled',[['si','Sí, también controlar trámites universitarios'],['no','No, únicamente entregables del servicio']],p?.routeEnabled===false?'no':'si')}${selectField('Situación administrativa','adminStatus',[['vigente','Vigente'],['archivado','Archivado administrativamente'],['desarchivamiento','En desarchivamiento'],['desarchivado','Desarchivado']],p?.adminStatus||'vigente')}${field('Enlace a la carpeta privada de Drive','folder',p?.folder||'','url','placeholder="Se creará automáticamente al guardar"')}${!edit?`<div class="field full"><label>Nombre del primer tesista *</label><input name="student1" required maxlength="150" placeholder="Nombres y apellidos"/></div><div class="field full"><label>Segundo tesista (opcional)</label><input name="student2" maxlength="150" placeholder="Nombres y apellidos"/></div>`:''}${!edit?`${selectField('Primer servicio contratado','serviceType',[['asesoria_completa','Asesoría completa (incluye estadísticas, diapositivas y preparación para sustentación)'],['estadistica','Análisis estadístico'],['sustentacion','Preparación para sustentación'],['diapositivas','Desarrollo de diapositivas'],['proyecto','Desarrollo de proyecto de tesis'],['redaccion','Redacción o corrección de tesis'],['personalizado','Otro servicio'],['ninguno','Agregar servicio después']], 'asesoria_completa')}${field('Monto total de este servicio (S/)','serviceAmount',0,'number','min="0" step="0.01"')}`:''}${textareaField('Contrato y acuerdos','description',p?.description||'','Servicio contratado, entregables, etapas y compromisos...')}</div>${formEnd()}</form>`)}
function modalStudent(id){const p=current(),s=p.students.find(x=>x.id===id);showModal(s?'Editar ficha del tesista':'Agregar tesista','El monto, los pagos y trámites finales son individuales; verifica si el ERP aplica a este programa.',`<form data-form="student" data-id="${E(id||'')}"><div class="form-grid">${field('Nombre y apellidos *','name',s?.name||'','text','required maxlength="150"')}${field('Honorarios del contrato anterior por tesista (S/)','agreed',s?.agreed||0,'number','min="0" step="0.01" required')}${field('Correo','email',s?.email||'','email')}${field('Celular','phone',s?.phone||'','tel')}${selectField('Estado del apto / requisito académico (si aplica)','apto',[['pendiente','Pendiente'],['solicitado','Solicitado'],['obtenido','Obtenido']],s?.apto||'pendiente')}${field('Fecha del apto ERP','aptoDate',s?.aptoDate||'','date')}${selectField('Pago de tasa de sustentación','sustPago', [['pendiente','Pendiente'],['pagado','Pagado']],s?.sustPago||'pendiente')}${field('Fecha de pago de sustentación','sustPagoDate',s?.sustPagoDate||'','date')}${field('Tasa universitaria de sustentación (S/, si aplica)','sustPagoMonto',s?.sustPagoMonto??(isUacPregrado(p)?1850:0),'number','min="0" step="0.01"')}${selectField('Trámite final de título','tituloStatus', [['pendiente','Pendiente'],['en tramite','En trámite'],['obtenido','Título obtenido']],s?.tituloStatus||'pendiente')}</div><div class="hint warning" style="margin-top:17px">La tasa de sustentación es un pago universitario individual y no forma parte de tus honorarios. El importe referencial de S/ 1,850 corresponde a los datos de pregrado UAC, NO necesariamente a otras universidades.</div>${formEnd()}</form>`)}

function modalInstallment(studentId){showModal('Programar una cuota','Define un compromiso de pago. Las cuotas se cubrirán en orden cronológico con los pagos registrados.',`<form data-form="installment" data-student="${E(studentId)}"><div class="form-grid">${field('Fecha de vencimiento *','date','','date','required')}${field('Monto de cuota (S/) *','amount','','number','min="0.01" step="0.01" required')}${field('Concepto','note','Cuota de asesoría')}</div>${formEnd()}</form>`)}
function getService(id){return servicesOf(current()).find(s=>s.id===id)}
function modalService(id=''){const p=current(),svc=id?getService(id):null;showModal(svc?'Editar servicio':'Contratar nuevo servicio','Registra cada contrato por separado. Los entregables incluidos NO generan cobros adicionales.',`<form data-form="service" data-id="${E(id)}"><div class="form-grid">${selectField('Tipo de servicio','type',SERVICE_TYPES,svc?.type||'estadistica')}${field('Nombre o alcance contratado *','name',svc?.name||'','text','placeholder="Vacío: se usa el nombre del tipo"')}${field('Precio TOTAL del contrato (S/)','agreed',svc?.agreed??0,'number','min="0" step="0.01" required')}${selectField('Estado comercial','status',[['pendiente','Pendiente'],['en curso','En curso'],['en revisión','En revisión'],['completado','Entregado'],['cancelado','Cancelado']],svc?.status||'pendiente')}${field('Inicio de trabajo (opcional)','startDate',svc?.startDate||'','date')}${field('Fecha final pactada (opcional)','dueDate',svc?.dueDate||'','date')}${textareaField('Alcance, exclusiones y acuerdos','notes',svc?.notes||'','Ej. Incluye dos revisiones; NO incluye tasas universitarias.')}<div class="field full"><label>Personas incluidas en este contrato</label>${(p.students||[]).map(st=>`<label style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><input type="checkbox" name="clientId" value="${E(st.id)}" ${!svc||(svc.clientIds||[]).includes(st.id)?'checked':''}>${E(st.name)}</label>`).join('')}<small class="muted">El precio se registra UNA vez por contrato; no se multiplica por número de tesistas.</small></div></div><div class="hint warning" style="margin-top:12px">La asesoría completa incluye estadística, desarrollo de diapositivas y preparación para sustentación como entregables de un solo contrato. Crear un servicio adicional solo cuando haya una contratación adicional real. Las fechas aparecen en la agenda solo si registras una meta en sus entregables.</div>${formEnd()}</form>`)}
function modalDeliverable(serviceId,deliverableId=''){const s=getService(serviceId),d=s?.deliverables?.find(x=>x.id===deliverableId);if(!s)return;showModal(d?'Editar entregable':'Agregar entregable',s.name,`<form data-form="deliverable" data-service="${E(serviceId)}" data-id="${E(deliverableId)}"><div class="form-grid">${field('Entregable *','title',d?.title||'','text','required maxlength="170"')}${selectField('Estado','status',STATUSES.map(st=>[st,LABELS[st]]),d?.status||'pendiente')}${field('Fecha acordada (opcional)','due',d?.due||'','date')}${field('Documento entregado (enlace Drive)','link',d?.link||'','url')}${textareaField('Observaciones','note',d?.note||'')}</div>${formEnd()}</form>`)}
function modalServicePayment(serviceId){const s=getService(serviceId);if(!s)return;showModal('Registrar cobro del servicio',s.name,`<form data-form="service-payment" data-service="${E(serviceId)}"><div class="form-grid">${field('Fecha *','date',today(),'date','required')}${field('Monto recibido (S/) *','amount','','number','min="0.01" step="0.01" required')}${field('Concepto','note','Abono del servicio')}${field('Comprobante Drive (URL)','receipt','','url')}</div>${formEnd()}</form>`)}
function modalServiceInstallment(serviceId){const s=getService(serviceId);if(!s)return;showModal('Programar cuota del servicio',s.name,`<form data-form="service-installment" data-service="${E(serviceId)}"><div class="form-grid">${field('Vencimiento *','date','','date','required')}${field('Monto de cuota (S/) *','amount','','number','min="0.01" step="0.01" required')}${field('Concepto','note','Cuota programada')}</div>${formEnd()}</form>`)}
function getServiceInstallments(s){let left=svcPaid(s);return (s.installments||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).map(c=>{const applied=Math.min(Math.max(0,+c.amount||0),Math.max(0,left));left=Math.max(0,left-applied);return {...c,balance:Math.max(0,(+c.amount||0)-applied)}})}
function renderServiceDetail(p){const list=servicesOf(p);return `<div class="row-flex" style="margin-bottom:17px"><div><h3>Servicios contratados</h3><div class="panel-sub">La ruta universitaria es independiente: un servicio de diapositivas no necesita completar todos los pasos de la tesis.</div></div><button class="btn btn-primary" data-action="add-service">＋ Contratar servicio</button></div>${list.length?list.map(s=>{const paid=svcPaid(s),scope=s.deliverables||[];return `<section class="panel" style="margin-bottom:18px"><div class="panel-head"><div><h2>${E(s.name||serviceLabel(s.type))}</h2><div class="panel-sub">${E(serviceLabel(s.type))} · ${E(s.status||'pendiente')} · ${E((s.clientIds||[]).length?(p.students||[]).filter(st=>(s.clientIds||[]).includes(st.id)).map(st=>st.name).join(' / '):'Sin beneficiarios asignados')} · ${scope.filter(x=>['completado','no aplica'].includes(x.status)).length}/${scope.length} entregables</div></div><div class="flex-gap"><button class="btn btn-sm" data-action="edit-service" data-id="${E(s.id)}">✎ Contrato</button><button class="btn btn-sm" data-action="delete-service" data-id="${E(s.id)}">Eliminar</button></div></div><div class="panel-body"><div class="student-metrics"><div class="metric-soft"><span>Precio total</span><strong class="money">${money(s.agreed)}</strong></div><div class="metric-soft"><span>Cobrado</span><strong class="money">${money(paid)}</strong></div><div class="metric-soft"><span>Saldo</span><strong class="money">${money(Math.max(0,(+s.agreed||0)-paid))}</strong></div></div><div class="progress" style="margin:14px 0"><div class="progress-fill" style="width:${serviceProgress(s)}%"></div></div>${s.notes?`<p class="panel-sub">${E(s.notes)}</p>`:''}<div class="row-flex section-bar"><h3>Entregables incluidos</h3><button class="btn btn-xs" data-action="add-deliverable" data-service="${E(s.id)}">＋ Personalizar</button></div>${scope.length?scope.map(d=>`<div class="task-row"><button class="task-mark ${d.status==='completado'?'done':''}" data-action="toggle-deliverable" data-service="${E(s.id)}" data-id="${E(d.id)}" aria-label="Completar entregable">${d.status==='completado'?'✓':'○'}</button><div class="task-content"><div class="name">${E(d.title)}</div><div class="detail">${d.due?'Fecha acordada: '+fmt(d.due):''}${d.note?' · '+E(d.note):''}${d.link&&safeUrl(d.link)?` · <a target="_blank" rel="noopener noreferrer" href="${E(d.link)}">Documento ↗</a>`:''}</div></div><span class="chip ${d.status==='completado'?'green':d.status==='en curso'?'blue':'amber'}">${E(LABELS[d.status]||d.status||'Pendiente')}</span><button class="btn btn-xs" data-action="edit-deliverable" data-service="${E(s.id)}" data-id="${E(d.id)}">Editar</button></div>`).join(''):'<p class="panel-sub">Añade los entregables acordados para este servicio.</p>'}<div class="row-flex section-bar"><h3>Cuotas de este servicio</h3><button class="btn btn-xs" data-action="add-service-installment" data-id="${E(s.id)}">＋ Cuota</button></div>${(s.installments||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Concepto</th><th>Programado</th><th>Saldo</th><th>Acción</th></tr></thead><tbody>${getServiceInstallments(s).map(c=>`<tr><td>${fmt(c.date)}</td><td>${E(c.note||'Cuota')}</td><td>${money(c.amount)}</td><td>${money(c.balance)}</td><td><button class="linkbutton" data-action="delete-service-installment" data-service="${E(s.id)}" data-id="${E(c.id)}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="panel-sub">No se ha acordado cronograma de cuotas.</p>'}<div class="row-flex section-bar"><h3>Pagos de este servicio</h3><button class="btn btn-xs" data-action="add-service-payment" data-id="${E(s.id)}">＋ Registrar pago</button></div>${(s.payments||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Acción</th></tr></thead><tbody>${s.payments.map(v=>`<tr><td>${fmt(v.date)}</td><td>${E(v.note||'Abono')}</td><td>${money(v.amount)}</td><td><button class="linkbutton" data-action="delete-service-payment" data-service="${E(s.id)}" data-id="${E(v.id)}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="panel-sub">Sin pagos registrados.</p>'}</div></section>`}).join(''):empty('Sin servicios registrados','Agrega un servicio, aunque se trate únicamente de análisis estadístico o preparación de diapositivas.','<button class="btn btn-primary" data-action="add-service">＋ Añadir servicio</button>')}<div class="hint">Cada contrato tiene su precio y cronograma. Los entregables incluidos en la asesoría completa no se suman como contratos independientes. Las tasas universitarias no forman parte de estos honorarios.</div>`}
function renderServices(){const entries=projects.flatMap(p=>servicesOf(p).map(s=>({p,s})));return `${header('Servicios contratados','Consulta todos tus contratos y entregables, independientes del trámite universitario.')}<div class="kpis"><div class="kpi"><div class="kpi-top">Contratos registrados</div><div class="kpi-value">${entries.length}</div></div><div class="kpi"><div class="kpi-top">Monto contratado</div><div class="kpi-value money">${money(entries.reduce((a,x)=>a+(+x.s.agreed||0),0))}</div></div><div class="kpi"><div class="kpi-top">Cobrado por servicios</div><div class="kpi-value money">${money(entries.reduce((a,x)=>a+svcPaid(x.s),0))}</div></div><div class="kpi"><div class="kpi-top">Servicios entregados</div><div class="kpi-value">${entries.filter(x=>x.s.status==='completado').length}</div></div></div><section class="panel"><div class="panel-head"><h2>Servicios y avances</h2></div><div class="panel-body">${entries.length?entries.map(({p,s})=>`<button class="mini-project" style="width:100%;margin-bottom:8px" data-action="open-service" data-id="${E(p.id)}"><div class="mini-info"><strong>${E(s.name)}</strong><small>${E(p.title)} · ${E((p.students||[]).map(x=>x.name).join(' / '))}</small></div><span class="chip blue">${serviceProgress(s)}%</span><span class="chip ${s.status==='completado'?'green':'amber'}">${E(s.status||'pendiente')}</span></button>`).join(''):empty('Sin contratos registrados','Registra un trabajo nuevo desde Mis tesis, aunque sea un servicio puntual.')}</div></section>`}
function modalTask(id,custom=false){const p=current();const t=custom?p.customTasks.find(x=>x.id===id):TASKMAP.get(id);if(!t)return;const info=custom?t:p.tasks?.[id]||{};showModal('Actualizar tarea',t.title,`<form data-form="task" data-id="${E(id)}" data-custom="${custom?'1':'0'}"><div class="form-grid">${selectField('Estado de tarea','status',STATUSES.map(s=>[s,LABELS[s]]),info.status||'pendiente')}${field('Fecha de vencimiento','due',info.due||'','date')}${field('Fecha de culminación / emisión','doneAt',info.doneAt||'','date')}${field('Responsable','owner',info.owner||'')}${field('Enlace a resolución o documento','link',info.link||'','url')}${textareaField('Notas, observaciones o acuerdos','note',info.note||'')}</div><div class="hint" style="margin-top:15px">Registra una fecha de vencimiento solo si se ha pactado una meta o compromiso real.</div>${formEnd()}</form>`)}
function modalCustomTask(section){showModal('Nueva tarea personalizada','Añade una actividad específica de esta tesis.',`<form data-form="custom-task" data-section="${E(section)}"><div class="form-grid">${field('Nombre de la actividad *','title','','text','required maxlength="180"')}${field('Fecha límite','due','','date')}${field('Responsable','owner','')}${textareaField('Descripción / notas','detail','')}</div>${formEnd()}</form>`)}
function modalDates(){const d=current().dates||{};showModal('Registrar fechas críticas','Fechas documentales de referencia. No producen avisos automáticos.',`<form data-form="dates"><div class="form-grid">${KEYDATES.map(([id,label])=>field(label,id,d[id]||'','date')).join('')}</div><div class="hint warning" style="margin-top:17px">Para el plazo de tres meses, registra únicamente trámites institucionales documentados posteriores a la inscripción. La regla de reinicio debe confirmarse con la UAC.</div>${formEnd()}</form>`)}
function modalDeadline(){showModal('Agregar fecha especial','Agrega únicamente una reunión o meta pactada que quieras recordar al entrar.',`<form data-form="deadline"><div class="form-grid">${field('Nombre del compromiso *','title','','text','required maxlength="160"')}${field('Fecha *','date','','date','required')}${textareaField('Notas','note','')}</div>${formEnd()}</form>`)}
function modalFollowup(){showModal('Registrar seguimiento','Deja constancia de una llamada, reunión, entrega o un compromiso del tesista.',`<form data-form="followup"><div class="form-grid">${field('Fecha del seguimiento','date',today(),'date','required')}${textareaField('Actividad o siguiente acción *','note','','Ej. Hablé con la tesista, enviará base de datos el viernes...',)}</div>${formEnd()}</form>`)}
function toast(msg){const node=document.createElement('div');node.className='toast';node.textContent=msg;document.getElementById('toastArea').append(node);setTimeout(()=>node.remove(),3600)}
function hideMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').hidden=true}
const chooseStudent=id=>current()?.students?.find(s=>s.id===id);
function handleAction(node){const act=node.dataset.action;if(!act)return;
 const p=current();switch(act){
 case 'view':view=node.dataset.view;hideMenu();render();window.scrollTo(0,0);break;
 case 'new-project':modalProject(false);break;
 case 'open-project':openProject(node.dataset.id);break;
 case 'open-finance':openProject(node.dataset.id,'students');break;
 case 'tab':tab=node.dataset.tab;render();break;
 case 'open-service':openProject(node.dataset.id,'services');break;
 case 'add-service':modalService();break;
 case 'edit-service':modalService(node.dataset.id);break;
 case 'add-deliverable':modalDeliverable(node.dataset.service);break;
 case 'edit-deliverable':modalDeliverable(node.dataset.service,node.dataset.id);break;
 case 'add-service-payment':modalServicePayment(node.dataset.id);break;
 case 'add-service-installment':modalServiceInstallment(node.dataset.id);break;
 case 'toggle-deliverable':{const s=getService(node.dataset.service),d=s?.deliverables.find(x=>x.id===node.dataset.id);if(!d)return;d.status=d.status==='completado'?'pendiente':'completado';modify(p,`Entregable «${d.title}»: ${d.status}.`);break;}
 case 'delete-service':{const s=getService(node.dataset.id);if(s&&confirm(`¿Eliminar el contrato «${s.name}» y sus pagos y cuotas?`)){p.services=p.services.filter(x=>x.id!==s.id);modify(p,`Se eliminó el contrato ${s.name}.`);}break;}
 case 'delete-service-payment':{const s=getService(node.dataset.service);if(s&&confirm('¿Eliminar este cobro?')){s.payments=s.payments.filter(x=>x.id!==node.dataset.id);modify(p,'Se eliminó un cobro del servicio.');}break;}
 case 'delete-service-installment':{const s=getService(node.dataset.service);if(s&&confirm('¿Eliminar esta cuota?')){s.installments=s.installments.filter(x=>x.id!==node.dataset.id);modify(p,'Se eliminó una cuota del servicio.');}break;}
 case 'edit-project':modalProject(true);break;
 case 'add-student':modalStudent('');break;
 case 'edit-student':modalStudent(node.dataset.student);break;
 case 'add-payment':{const st=chooseStudent(node.dataset.student);if(projectHasService(p)&&!((+st?.agreed||0)>0||(st?.payments||[]).length||(st?.installments||[]).length)){alert('Los pagos de contratos nuevos se registran en «Servicios y entregables» para evitar duplicados.');break;}modalPayment(node.dataset.student);break;}
 case 'add-installment':{const st=chooseStudent(node.dataset.student);if(projectHasService(p)&&!((+st?.agreed||0)>0||(st?.payments||[]).length||(st?.installments||[]).length)){alert('Programa las cuotas de los nuevos contratos en «Servicios y entregables».');break;}modalInstallment(node.dataset.student);break;}
 case 'edit-task':modalTask(node.dataset.id,node.dataset.custom==='1');break;
 case 'add-custom-task':modalCustomTask(node.dataset.section);break;
 case 'edit-dates':modalDates();break;
 case 'add-deadline':modalDeadline();break;
 case 'followup':modalFollowup();break;
 case 'close-modal':closeModal();break;
 case 'toggle-task':{
  const tId=node.dataset.id,custom=node.dataset.custom==='1';
  if(custom){const t=p.customTasks.find(x=>x.id===tId);if(!t)return;t.status=t.status==='completado'?'pendiente':'completado';t.doneAt=t.status==='completado'?today():'';modify(p,`Tarea «${t.title}»: ${LABELS[t.status]}.`);break;}
  let info=p.tasks[tId]||{},now=info.status==='completado'?'pendiente':'completado';info.status=now;info.doneAt=now==='completado'?today():'';p.tasks[tId]=info;
  if(now==='completado'&&DATE_FOR_TASK[tId])p.dates[DATE_FOR_TASK[tId]]=info.doneAt;
  modify(p,`Tarea «${TASKMAP.get(tId)?.title||tId}»: ${LABELS[now]}.`);break;
 }
 case 'delete-payment':{const s=chooseStudent(node.dataset.student);if(!s)return;if(confirm(`¿Eliminar este pago de ${s.name}? Esta acción modifica los saldos.`)){s.payments=s.payments.filter(x=>x.id!==node.dataset.id);modify(p,`Se eliminó un pago del expediente de ${s.name}.`);}break;}
 case 'delete-installment':{const s=chooseStudent(node.dataset.student);if(!s)return;if(confirm('¿Eliminar esta cuota del cronograma?')){s.installments=s.installments.filter(x=>x.id!==node.dataset.id);modify(p,`Se actualizó el cronograma de cuotas de ${s.name}.`);}break;}
 case 'toggle-deadline':{const d=p.deadlines.find(x=>x.id===node.dataset.id);if(!d)return;d.done=!d.done;modify(p,`Fecha «${d.title}»: ${d.done?'realizada':'reabierta'}.`);break;}
 case 'delete-deadline':{const d=p.deadlines.find(x=>x.id===node.dataset.id);if(d&&confirm(`¿Eliminar el compromiso «${d.title}»?`)){p.deadlines=p.deadlines.filter(x=>x.id!==d.id);modify(p,'Se eliminó una fecha especial.');}break;}
 case 'agenda-filter':agendaFilter=node.dataset.filter;render();break;
 case 'archive-project':{const archived=p.status==='archivada';if(confirm(archived?'¿Reactivar esta tesis?':'¿Archivar esta tesis? Sus datos se conservarán y dejará de producir alertas.')){p.status=archived?'activa':'archivada';modify(p,archived?'Tesis reactivada.':'Expediente archivado.');}break;}
 case 'delete-project':if(confirm(`Esta acción ELIMINA definitivamente la tesis «${p.title}» y todos sus pagos, cuotas y notas. ¿Continuar?`)){const name=p.title;projects=projects.filter(x=>x.id!==p.id);queueDelete(p.id);view='theses';selectedId=null;render();toast(`Expediente eliminado: ${name}`)}break;
 case 'retry-sync':retrySync();break;
 case 'export-json':exportJson();break;
 case 'export-csv':exportCsv();break;
 case 'export-ics':exportIcs();break;
 case 'import-json':document.getElementById('importFile')?.click();break;
 }
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(b){if(b.closest('.project-card')&&b!==ev.target.closest('.project-card')&&ev.target.closest('button'))return;handleAction(b)}else if(ev.target.matches('[data-shade]'))closeModal()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.project-card')){ev.preventDefault();openProject(ev.target.dataset.id)}});
document.getElementById('menuBtn').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobileOverlay').hidden=!document.getElementById('sidebar').classList.contains('open')});
document.getElementById('mobileOverlay').addEventListener('click',hideMenu);
document.addEventListener('input',ev=>{if(ev.target.id==='searchProjects'){query=ev.target.value;const pos=ev.target.selectionStart;render();const el=document.getElementById('searchProjects');el?.focus();try{el.setSelectionRange(pos,pos)}catch{}}});
document.addEventListener('change',ev=>{if(ev.target.name==='serviceType'){const choice=document.querySelector('.modal [name="routeEnabled"]');if(choice)choice.value=['asesoria_completa','proyecto'].includes(ev.target.value)?'si':'no';}if(ev.target.id==='projectFilter'){projectFilter=ev.target.value;render()}if(ev.target.id==='importFile'){importBackup(ev.target.files?.[0]);ev.target.value=''}});
const formVal=(data,k)=>(data.get(k)||'').toString().trim();
function handleSubmit(form){const data=new FormData(form),type=form.dataset.form,p=current();let didSave=false;
 switch(type){
 case 'project':{
  const title=formVal(data,'title'),folder=formVal(data,'folder');if(!title){alert('Indica el título de la tesis.');return}if(folder&&!safeUrl(folder)){alert('El enlace de la carpeta debe comenzar con https://');return}
  if(form.dataset.edit==='1'){Object.assign(p,{title,university:formVal(data,'university'),level:formVal(data,'level'),advisor:formVal(data,'advisor'),folder,description:formVal(data,'description'),adminStatus:formVal(data,'adminStatus'),routeEnabled:formVal(data,'routeEnabled')==='si'});modify(p,'Se actualizó la ficha del expediente.');}
  else{const student1=formVal(data,'student1');if(!student1){alert('Indica el primer tesista.');return}const obj=newProject({title,university:formVal(data,'university'),level:formVal(data,'level'),advisor:formVal(data,'advisor'),folder,description:formVal(data,'description'),names:[student1,formVal(data,'student2')],serviceType:formVal(data,'serviceType'),serviceAmount:+formVal(data,'serviceAmount')||0});obj.adminStatus=formVal(data,'adminStatus')||'vigente';obj.routeEnabled=formVal(data,'routeEnabled')==='si';projects.unshift(obj);persist(obj);selectedId=obj.id;view='detail';tab='services';render();}didSave=true;break;
 }
 case 'student':{
  let s=chooseStudent(form.dataset.id),name=formVal(data,'name');const value=+formVal(data,'agreed');if(!name||!Number.isFinite(value)||value<0){alert('Verifica el nombre y el monto acordado.');return}
  if(projectHasService(p)&&value>0&&!(+s?.agreed>0)&&!confirm('Ya existen servicios contratados. Si introduces también honorarios por tesista, el total se sumará y podría duplicar cobros. ¿Confirmas que es un contrato distinto?'))return;if(!s){s={id:uid(),payments:[],installments:[]};p.students=p.students||[];p.students.push(s)}Object.assign(s,{name,email:formVal(data,'email'),phone:formVal(data,'phone'),agreed:value,apto:formVal(data,'apto'),aptoDate:formVal(data,'aptoDate'),sustPago:formVal(data,'sustPago'),sustPagoDate:formVal(data,'sustPagoDate'),sustPagoMonto:Math.max(0,+formVal(data,'sustPagoMonto')||0),tituloStatus:formVal(data,'tituloStatus')});modify(p,`Datos actualizados del tesista ${name}.`);didSave=true;break;
 }
 case 'payment':{
  let s=chooseStudent(form.dataset.student),amount=+formVal(data,'amount'),date=formVal(data,'date'),receipt=formVal(data,'receipt');if(!s||!Number.isFinite(amount)||amount<=0||!date){alert('Indica fecha y monto positivo.');return}if(receipt&&!safeUrl(receipt)){alert('El comprobante debe usar http:// o https://');return}
  s.payments=s.payments||[];s.payments.push({id:uid(),amount,date,note:formVal(data,'note'),receipt});modify(p,`Pago registrado de ${s.name}: ${money(amount)} (${fmt(date)}).`);didSave=true;break;
 }
 case 'installment':{
  let s=chooseStudent(form.dataset.student),amount=+formVal(data,'amount'),date=formVal(data,'date');if(!s||!Number.isFinite(amount)||amount<=0||!date){alert('Completa fecha e importe de la cuota.');return}
  s.installments=s.installments||[];s.installments.push({id:uid(),amount,date,note:formVal(data,'note')});modify(p,`Cuota programada para ${s.name}: ${money(amount)} (${fmt(date)}).`);didSave=true;break;
 }
 case 'service':{
  let svc=form.dataset.id?getService(form.dataset.id):null;const type=formVal(data,'type'),amount=+formVal(data,'agreed'),name=formVal(data,'name')||serviceLabel(type),dueDate=formVal(data,'dueDate');if(!SERVICE_TEMPLATES.hasOwnProperty(type)||!Number.isFinite(amount)||amount<0){alert('Verifica tipo y precio del servicio.');return}
  if(svc&&type!==svc.type){if(!confirm('Cambiar el tipo de servicio reemplazará sus entregables actuales. ¿Continuar?'))return;svc.deliverables=serviceBlueprint(type).deliverables;}if(!svc){if(['estadistica','sustentacion','diapositivas'].includes(type)&&servicesOf(p).some(x=>x.type==='asesoria_completa')&&!confirm('La asesoría completa ya incluye esta actividad. ¿Confirmas que es un servicio ADICIONAL contratado y cobrable por separado?'))return;svc=serviceBlueprint(type,name,amount);p.services=p.services||[];p.services.push(svc);}
  Object.assign(svc,{name,type,agreed:amount,status:formVal(data,'status'),startDate:formVal(data,'startDate'),dueDate,notes:formVal(data,'notes'),clientIds:data.getAll('clientId')});modify(p,`Servicio ${name} actualizado.`);didSave=true;break;
 }
 case 'deliverable':{
  const svc=getService(form.dataset.service);if(!svc)return;let d=svc.deliverables.find(x=>x.id===form.dataset.id);const title=formVal(data,'title'),link=formVal(data,'link');if(!title||link&&!safeUrl(link)){alert('Revisa el título y el enlace del entregable.');return}if(!d){d={id:uid()};svc.deliverables.push(d)}Object.assign(d,{title,status:formVal(data,'status'),due:formVal(data,'due'),link,note:formVal(data,'note')});modify(p,`Entregable actualizado: ${title}.`);didSave=true;break;
 }
 case 'service-payment':{
  const svc=getService(form.dataset.service),amount=+formVal(data,'amount'),date=formVal(data,'date'),receipt=formVal(data,'receipt');if(!svc||!Number.isFinite(amount)||amount<=0||!date||receipt&&!safeUrl(receipt)){alert('Verifica fecha, monto y comprobante.');return}svc.payments=svc.payments||[];svc.payments.push({id:uid(),date,amount,note:formVal(data,'note'),receipt});modify(p,`Cobro de ${money(amount)} para servicio ${svc.name}.`);didSave=true;break;
 }
 case 'service-installment':{
  const svc=getService(form.dataset.service),amount=+formVal(data,'amount'),date=formVal(data,'date');if(!svc||!Number.isFinite(amount)||amount<=0||!date){alert('Completa los datos de cuota del servicio.');return}svc.installments=svc.installments||[];svc.installments.push({id:uid(),date,amount,note:formVal(data,'note')});modify(p,`Cuota de ${money(amount)} agregada a ${svc.name}.`);didSave=true;break;
 }
 case 'task':{
  const id=form.dataset.id,custom=form.dataset.custom==='1',t=custom?p.customTasks.find(x=>x.id===id):TASKMAP.get(id);if(!t)return;
  const info=custom?t:(p.tasks[id]||{}),oldStatus=info.status||'pendiente';let newStatus=formVal(data,'status');if(!STATUSES.includes(newStatus))newStatus='pendiente';
  const link=formVal(data,'link');if(link&&!safeUrl(link)){alert('Introduce un enlace web válido.');return}
  Object.assign(info,{status:newStatus,due:formVal(data,'due'),doneAt:formVal(data,'doneAt')||(newStatus==='completado'?today():''),owner:formVal(data,'owner'),link,note:formVal(data,'note')});if(!custom)p.tasks[id]=info;
  if(newStatus==='completado'&&DATE_FOR_TASK[id]&&info.doneAt)p.dates[DATE_FOR_TASK[id]]=info.doneAt;
  modify(p,`Tarea «${t.title}» actualizada (${LABELS[newStatus]}).`);didSave=true;break;
 }
 case 'custom-task':{
  const title=formVal(data,'title');if(!title)return;
  p.customTasks=p.customTasks||[];p.customTasks.push({id:uid(),section:form.dataset.section,title,detail:formVal(data,'detail'),due:formVal(data,'due'),owner:formVal(data,'owner'),status:'pendiente'});modify(p,`Se agregó tarea personalizada: ${title}.`);didSave=true;break;
 }
 case 'dates':{
  p.dates=p.dates||{};KEYDATES.forEach(([id])=>p.dates[id]=formVal(data,id));modify(p,'Se actualizaron las fechas críticas para control administrativo.');didSave=true;break;
 }
 case 'deadline':{
  const title=formVal(data,'title'),date=formVal(data,'date');if(!title||!date)return;p.deadlines=p.deadlines||[];p.deadlines.push({id:uid(),title,date,note:formVal(data,'note'),done:false});modify(p,`Se registró fecha especial «${title}»: ${fmt(date)}.`);didSave=true;break;
 }
 case 'followup':{
  const note=formVal(data,'note'),date=formVal(data,'date');if(!note||!date){alert('Indica fecha y actividad realizada.');return}
  p.lastFollowUp=date;modify(p,`Seguimiento (${fmt(date)}): ${note}`);didSave=true;break;
 }
 }
 if(didSave){closeModal();toast(CLOUD?'Cambios enviados a Google (revisa estado de guardado).':'Cambio guardado en prueba local.');}
}
document.addEventListener('submit',event=>{const f=event.target.closest('form[data-form]');if(!f)return;event.preventDefault();handleSubmit(f)});
function download(content,filename,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJson(){download(JSON.stringify({application:'ESKALA Control de Tesis',version:1,exportedAt:new Date().toISOString(),projects},null,2),`eskala-respaldo-${today()}.json`,'application/json;charset=utf-8');toast('Respaldo JSON exportado. Guárdalo en una carpeta privada.')}
const csvQuote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
function exportCsv(){const rows=[['Trabajo / tesis','Tipo de contrato','Titular / servicio','Correo','Apto ERP','Monto acordado (S/)','Pagado (S/)','Saldo (S/)','Cuotas programadas','Cuotas vencidas','Último seguimiento','Avance (%)']];projects.forEach(p=>(p.students||[]).forEach(s=>{const overdue=getInstallments(s).filter(c=>c.balance>.005&&daysLeft(c.date)<0).length;rows.push([p.title,'Contrato anterior por tesista',s.name,s.email||'',s.apto||'pendiente',(+s.agreed||0).toFixed(2),paid(s).toFixed(2),Math.max(0,(+s.agreed||0)-paid(s)).toFixed(2),(s.installments||[]).length,overdue,p.lastFollowUp||'',progress(p)])}));projects.forEach(p=>servicesOf(p).forEach(s=>{const ov=getServiceInstallments(s).filter(c=>c.balance>.005&&daysLeft(c.date)<0).length;rows.push([p.title,serviceLabel(s.type),s.name,'','',(+s.agreed||0).toFixed(2),svcPaid(s).toFixed(2),Math.max(0,(+s.agreed||0)-svcPaid(s)).toFixed(2),(s.installments||[]).length,ov,p.lastFollowUp||'',serviceProgress(s)])}));download('\ufeff'+rows.map(r=>r.map(csvQuote).join(';')).join('\r\n'),`eskala-pagos-${today()}.csv`,'text/csv;charset=utf-8');toast('Resumen CSV generado.');}
function icsText(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportIcs(){const a=allAlerts().filter(x=>x.date&&x.left>=-14);if(!a.length){alert('Todavía no hay alertas con fecha para exportar.');return}let timestamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ESKALA//Control de Tesis//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
 a.forEach((x,i)=>{const d=x.date.replace(/-/g,''),end=byDays(x.date,1).replace(/-/g,'');lines.push('BEGIN:VEVENT',`UID:${icsText(x.id)}@eskala-tesis.local`,`DTSTAMP:${timestamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${end}`,`SUMMARY:${icsText('TESIS: '+x.title)}`,`DESCRIPTION:${icsText(x.projectTitle+' | '+x.detail+' | Aviso referencial desde ESKALA')}`,'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-P7D',`DESCRIPTION:${icsText('En 7 días: '+x.title)}`,'END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-P1D',`DESCRIPTION:${icsText('Mañana: '+x.title)}`,'END:VALARM','END:VEVENT')});lines.push('END:VCALENDAR');download(lines.join('\r\n')+'\r\n',`eskala-alertas-${today()}.ics`,'text/calendar;charset=utf-8');toast(`Calendario exportado con ${a.length} fecha(s).`)}
async function importBackup(file){if(!file)return;if(file.size>12e6){alert('El respaldo es demasiado grande para esta versión (máximo 12 MB).');return}
 try{const text=await file.text(),json=JSON.parse(text);if(json?.application!=='ESKALA Control de Tesis'||!Array.isArray(json.projects)||json.version!==1)throw Error('El archivo no corresponde a un respaldo compatible de ESKALA.');
 if(json.projects.length>1500||json.projects.some(p=>!p||typeof p.id!=='string'||typeof p.title!=='string'||!Array.isArray(p.students)||!p.tasks||typeof p.tasks!=='object'))throw Error('El archivo no tiene una estructura válida.');
 if(!confirm(`¿REEMPLAZAR los ${projects.length} expediente(s) actuales con ${json.projects.length} del respaldo? Descarga primero una copia de los datos actuales.`))return;
 projects=json.projects.map(p=>({...p,students:(p.students||[]).map(s=>({...s,payments:Array.isArray(s.payments)?s.payments:[],installments:Array.isArray(s.installments)?s.installments:[]})),dates:p.dates||{},deadlines:Array.isArray(p.deadlines)?p.deadlines:[],customTasks:Array.isArray(p.customTasks)?p.customTasks:[],history:Array.isArray(p.history)?p.history:[],services:Array.isArray(p.services)?p.services:[]}));if(CLOUD){saving=true;setSaveStatus('Restaurando datos en Drive…');google.script.run.withSuccessHandler(()=>{pendingWrites.clear();pendingDeletes.clear();saving=false;setSaveStatus('Respaldo restaurado en Google ✓');render();}).withFailureHandler(e=>{saving=false;setSaveStatus('Falló la restauración');alert('Error de restauración: '+(e.message||e));}).restoreProjects(projects);}else persist();view='dashboard';selectedId=null;render();toast('Se solicitó la restauración del respaldo.');
 }catch(err){alert('No se pudo importar: '+(err.message||'archivo inválido'))}}
if(CLOUD){
 document.getElementById('main').innerHTML='<div class="page-header"><div><h1>Conectando con tu Google Drive…</h1><p>Cargando expedientes privados.</p></div></div>';
 google.script.run.withSuccessHandler(data=>{projects=Array.isArray(data)?data:[];setSaveStatus('Conectado a Google ✓');render();}).withFailureHandler(e=>{document.getElementById('main').innerHTML='<div class="page-header"><div><h1>No se pudo acceder a Google</h1><p>'+E(e.message||e)+'</p><p>Comprueba que ejecutaste setupEskala() y autorizaste la aplicación.</p></div></div>';setSaveStatus('Error de conexión');}).getProjects();
 google.script.run.withSuccessHandler(data=>{systemInfo=data;if(view==='backup')render();}).withFailureHandler(()=>{}).getSystemInfo();
}else{setSaveStatus('Prueba local sin conexión a Google');render();}
